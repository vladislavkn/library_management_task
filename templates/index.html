<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Library Catalog</title>
    <!-- Link to External CSS -->
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Book Catalog</h1>
      <div class="forms-container">
        <div class="form-container">
          <h2>Search form</h2>
          <form id="searchForm">
            <label for="searchInput">Search:</label>
            <input
              type="text"
              id="searchInput"
              placeholder="Search available books..."
            />
            <button type="submit">Search</button>
          </form>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Place</th>
            <th>Publisher</th>
            <th>Genre</th>
            <th>Available</th>
          </tr>
        </thead>
        <tbody id="book-table">
          <!-- Book entries will be populated here -->
        </tbody>
      </table>

      <!-- Forms Container -->
      <div class="forms-container">
        <!-- Borrow Form -->
        <div class="form-container">
          <h2>Borrow Book</h2>
          <form id="borrowForm">
            <label for="borrowBookId">Book:</label>
            <select id="borrowBookId" required>
              <option value="">Select a Book</option>
              <!-- Options will be populated dynamically -->
            </select>

            <label for="borrowerEmail">Email:</label>
            <input type="email" id="borrowerEmail" required />

            <label for="borrowerPassword">Password:</label>
            <input type="password" id="borrowerPassword" required />

            <button type="submit">Borrow Book</button>
          </form>
        </div>

        <!-- Return Form -->
        <div class="form-container">
          <h2>Return Book</h2>
          <form id="returnForm">
            <label for="returnBookId">Book:</label>
            <select id="returnBookId" required>
              <option value="">Select a Book</option>
              <!-- Options will be populated dynamically -->
            </select>

            <label for="returnDate">Return Date:</label>
            <input type="date" id="returnDate" required />

            <button type="submit">Return Book</button>
          </form>
        </div>
      </div>

      <!-- Clear Data Button -->
      <div class="form-container">
        <button id="clearDataBtn">Clear All Borrowing Data</button>
      </div>
      <a href="/admin">Admin resource</a>
    </div>

    <!-- Link to External JS -->
    <script src="/static/js/index.js"></script>
  </body>
</html>
